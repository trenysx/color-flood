<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Color Flood</title>
<meta name="description" content="Classic flood-fill puzzle game. Fill the board with one color in limited moves. Single file, offline, no tracking.">
<style>
:root {
  --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
  --accent: #22d3ee; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  --radius: 16px; --shadow: 0 20px 40px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f8fafc; --panel: #fff; --text: #0f172a; --muted: #64748b; --shadow: 0 20px 40px rgba(0,0,0,.1); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; min-height: 100vh; }
header { text-align: center; margin-bottom: 12px; }
h1 { margin: 0 0 4px; font-size: clamp(28px, 6vw, 44px); font-weight: 700; letter-spacing: -0.02em; }
.subtitle { margin: 0; color: var(--muted); font-size: 14px; }
.stats { display: flex; gap: 16px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--muted); border-radius: 12px; padding: 8px 16px; min-width: 80px; }
.stat-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stat-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
#board { display: grid; gap: 2px; background: var(--muted); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); touch-action: manipulation; }
.cell { aspect-ratio: 1; border-radius: 4px; transition: transform 0.08s ease, opacity 0.08s ease; cursor: pointer; }
.cell:active { transform: scale(0.95); }
.palette { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.color-btn {
  width: 48px; height: 48px; border: 3px solid transparent; border-radius: 12px;
  cursor: pointer; transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.color-btn:hover { transform: scale(1.08); }
.color-btn:active { transform: scale(0.95); }
.color-btn.active { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent), 0 4px 12px rgba(0,0,0,.3); }
.color-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent), 0 4px 12px rgba(0,0,0,.3); }
button#newGame {
  margin-top: 20px; padding: 12px 28px; font-size: 15px; font-weight: 600;
  background: var(--accent); color: var(--bg); border: none; border-radius: 10px;
  cursor: pointer; transition: background 0.1s, transform 0.05s;
}
button#newGame:hover { background: var(--accent-dim); }
button#newGame:active { transform: scale(0.98); }
footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 12px; }
footer a { color: var(--accent); text-decoration: none; }
footer a:hover { text-decoration: underline; }
@media (max-width: 420px) { .color-btn { width: 40px; height: 40px; } }
</style>
</head>
<body>
<header>
  <h1>Color Flood</h1>
  <p class="subtitle">Fill the board in ≤ 25 moves</p>
</header>

<div class="stats">
  <div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="moves">0</span>/25</div>
  <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">–</span></div>
</div>

<div id="board" role="grid" aria-label="Game board"></div>

<div class="palette" id="palette" role="group" aria-label="Color choices"></div>

<button id="newGame" aria-label="New game">New Game</button>

<footer>
  <a href="https://github.com/trenysx/color-flood" target="_blank" rel="noopener">GitHub</a> ·
  <a href="https://en.wikipedia.org/wiki/Flood_it" target="_blank" rel="noopener">About Flood-It</a> ·
  Apache-2.0
</footer>

<script>
(function () {
  const SIZE = 14;
  const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#a855f7'];
  const MAX_MOVES = 25;

  const boardEl = document.getElementById('board');
  const paletteEl = document.getElementById('palette');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const newGameBtn = document.getElementById('newGame');

  let grid = [];
  let moves = 0;
  let currentColor = null;
  let gameOver = false;

  function init() {
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        grid[y][x] = Math.floor(Math.random() * COLORS.length);
      }
    }
    // Ensure top-left has a unique color to start
    const startColor = grid[0][0];
    const otherColors = COLORS.map((_, i) => i).filter(c => c !== startColor);
    if (otherColors.length) {
      const newColor = otherColors[Math.floor(Math.random() * otherColors.length)];
      floodFill(0, 0, startColor, newColor);
    }
    moves = 0;
    gameOver = false;
    currentColor = grid[0][0];
    render();
    updatePalette();
  }

  function floodFill(x, y, oldColor, newColor) {
    if (oldColor === newColor) return;
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) continue;
      if (grid[cy][cx] !== oldColor) continue;
      grid[cy][cx] = newColor;
      stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
    }
  }

  function checkWin() {
    const target = grid[0][0];
    return grid.every(row => row.every(c => c === target));
  }

  function handleColorClick(colorIndex) {
    if (gameOver || colorIndex === currentColor) return;
    floodFill(0, 0, currentColor, colorIndex);
    currentColor = colorIndex;
    moves++;
    render();
    updateMoves();
    if (checkWin()) {
      gameOver = true;
      const best = parseInt(localStorage.getItem('color-flood-best') || '999', 10);
      if (moves < best) {
        localStorage.setItem('color-flood-best', moves.toString());
        bestEl.textContent = moves;
      }
      setTimeout(() => alert(`You won in ${moves} moves!`), 50);
    }
  }

  function render() {
    boardEl.innerHTML = '';
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.background = COLORS[grid[y][x]];
        cell.dataset.x = x;
        cell.dataset.y = y;
        boardEl.appendChild(cell);
      }
    }
  }

  function updatePalette() {
    paletteEl.innerHTML = '';
    COLORS.forEach((color, i) => {
      const btn = document.createElement('button');
      btn.className = 'color-btn' + (i === currentColor ? ' active' : '');
      btn.style.background = color;
      btn.setAttribute('aria-label', `Color ${i + 1}`);
      btn.setAttribute('aria-pressed', i === currentColor);
      btn.addEventListener('click', () => handleColorClick(i));
      paletteEl.appendChild(btn);
    });
  }

  function updateMoves() {
    movesEl.textContent = moves;
    if (moves > MAX_MOVES && !gameOver) {
      gameOver = true;
      setTimeout(() => alert(`Game over! You used ${moves} moves. Try again.`), 50);
    }
  }

  newGameBtn.addEventListener('click', init);

  // Keyboard support
  document.addEventListener('keydown', e => {
    const n = parseInt(e.key, 10);
    if (!isNaN(n) && n >= 1 && n <= COLORS.length) {
      handleColorClick(n - 1);
    } else if (e.key === 'n' || e.key === 'N') {
      init();
    }
  });

  // Restore best score
  const best = localStorage.getItem('color-flood-best');
  if (best) bestEl.textContent = best;

  init();
})();
</script>
</body>
</html>
